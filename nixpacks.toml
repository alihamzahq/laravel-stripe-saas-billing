[phases.setup]
nixPkgs = ["php82", "php82Extensions.bcmath", "php82Extensions.mbstring", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.curl", "php82Extensions.xml", "php82Extensions.zip", "php82Extensions.tokenizer", "php82Extensions.openssl", "php82Extensions.ctype", "php82Extensions.fileinfo", "nodejs_20", "npm-9_x"]

[phases.install]
dependsOn = ["setup"]
cmds = ["composer install --no-dev --optimize-autoloader", "npm ci && npm run build"]

[phases.build]
cmds = ["php artisan optimize", "php artisan migrate --force"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"